name: CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - develop
jobs:
  maven_build:
    uses: suppada/java-app/.github/workflows/maven_build.yml@main
    with:
      java_version: '21'
      enable_release: true
    permissions:
      contents: write
      packages: read
  docker_build:
    needs: maven_build
    uses: suppada/java-app/.github/workflows/docker_build.yml@main
    with:
      image_name: ${{ github.repository }}
      registry: ghcr.io
    permissions:
      contents: read  
      packages: write